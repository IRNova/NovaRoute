name: Deploy GitBook to GitHub Pages

# Manual dispatch only. The docs now point at the IRNova/NovaRoute repository.
# The push trigger stays off until the deploy key for the Pages repo is in
# place, then it can be re-enabled.
on:
  workflow_dispatch:

concurrency:
  group: gitbook-pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gitbook
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Build static export
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_BASE_PATH: ""

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Deploy to novaroute.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.GH_PAGES_DEPLOY_KEY }}
          external_repository: IRNova/novaroute.github.io
          publish_branch: main
          publish_dir: gitbook/out
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "deploy: ${{ github.sha }}"
