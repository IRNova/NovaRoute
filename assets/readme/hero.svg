<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.5" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="glow" x1="640" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>
  <circle cx="200" cy="180" r="280" fill="url(#glow)"/>
  <circle cx="1080" cy="180" r="220" fill="url(#glow)"/>

  <!-- Network / route nodes -->
  <g stroke="#6366f1" stroke-width="2" stroke-linecap="round" opacity="0.35">
    <line x1="220" y1="220" x2="380" y2="160"/>
    <line x1="380" y1="160" x2="560" y2="200"/>
    <line x1="560" y1="200" x2="720" y2="150"/>
    <line x1="720" y1="150" x2="900" y2="190"/>
    <line x1="900" y1="190" x2="1060" y2="170"/>
  </g>
  <g fill="#818cf8">
    <circle cx="220" cy="220" r="6"/>
    <circle cx="380" cy="160" r="6"/>
    <circle cx="560" cy="200" r="6"/>
    <circle cx="720" cy="150" r="6"/>
    <circle cx="900" cy="190" r="6"/>
    <circle cx="1060" cy="170" r="6"/>
  </g>

  <!-- Logo mark -->
  <g transform="translate(88, 130)">
    <rect x="0" y="0" width="64" height="64" rx="14" fill="#6366f1"/>
    <path d="M20 20h24v6H20zM20 34h18v6H20zM20 48h12v6H20z" fill="#ffffff"/>
    <path d="M42 34l10 10V24L42 34z" fill="#c7d2fe"/>
  </g>

  <!-- Title -->
  <text x="640" y="175" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="62" font-weight="800" fill="#ffffff">NovaRoute</text>
  <text x="640" y="225" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">Self-hosted AI provider gateway, model combos &amp; unified chat</text>

  <!-- Tagline pills -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
    <rect x="456" y="260" width="110" height="30" rx="15" fill="#334155" stroke="#6366f1" stroke-width="1"/>
    <text x="511" y="280" text-anchor="middle" fill="#e0e7ff">40+ Providers</text>

    <rect x="585" y="260" width="110" height="30" rx="15" fill="#334155" stroke="#6366f1" stroke-width="1"/>
    <text x="640" y="280" text-anchor="middle" fill="#e0e7ff">OpenAI API</text>

    <rect x="714" y="260" width="110" height="30" rx="15" fill="#334155" stroke="#6366f1" stroke-width="1"/>
    <text x="769" y="280" text-anchor="middle" fill="#e0e7ff">Self-hosted</text>
  </g>
</svg>
